<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mortgage Calculator – Pro</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
:root{
  --accent:#1f6fb6;
  --bg:#f7fbfd;
  --card:#ffffff;
  --muted:#6b7280;
  --radius:12px;
  --shadow:0 8px 28px rgba(10,20,30,.06);
  --max:1200px;
}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,Arial;background:var(--bg);color:#111}
.wrap{max-width:var(--max);margin:auto;padding:16px}
h1{margin:0;color:var(--accent)}
p{color:var(--muted)}

.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:16px}
label{font-size:13px;color:var(--muted);display:block;margin-bottom:6px}
input,select{width:100%;padding:11px;border:1px solid #e5eef5;border-radius:10px;font-size:15px}

.grid{display:grid;grid-template-columns:1fr}
@media(min-width:900px){.grid{grid-template-columns:1fr 440px;gap:18px}}

.btn{padding:10px 14px;border-radius:8px;border:none;font-weight:600;cursor:pointer}
.primary{background:var(--accent);color:#fff}
.alt{background:#eef6fb;color:var(--accent)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.col{flex:1}

.summary{font-size:14px}
.summary strong{color:#111}

.chartBox{height:280px}
canvas{width:100%!important;height:100%!important}

table{width:100%;border-collapse:collapse;min-width:760px}
th,td{padding:10px;border-bottom:1px solid #edf2f7;text-align:right;font-size:14px}
th{background:#2f6b9f;color:#fff;position:sticky;top:0}
td:first-child,th:first-child{text-align:center}
td:nth-child(2),th:nth-child(2){text-align:left}

.scroll{overflow:auto}
.toggle{display:flex;gap:6px}
.toggle button{padding:6px 10px;border-radius:6px;border:1px solid #dbe9f6;background:#f8fbff}
.toggle .active{background:var(--accent);color:#fff}

@media print{
  .btn,.toggle{display:none}
  body{background:#fff}
}
</style>
</head>

<body>
<div class="wrap">
<h1>Mortgage Calculator</h1>
<p>Monthly payment, amortization, charts & printable results</p>

<div class="card">
<label>Currency</label>
<select id="currency">
<option value="USD">$ USD</option>
<option value="EUR">€ EUR</option>
<option value="GBP">£ GBP</option>
<option value="INR">₹ INR</option>
</select>
</div>

<div class="grid">

<!-- INPUTS -->
<div class="card">
<div class="row">
<div class="col">
<label>Home Price</label>
<input id="price" value="400000">
</div>
<div style="width:120px">
<label>Down (%)</label>
<input id="down" value="20">
</div>
</div>

<div class="row">
<div class="col">
<label>Loan Term (years)</label>
<input id="years" value="30">
</div>
<div class="col">
<label>Interest Rate (%)</label>
<input id="rate" value="6.228">
</div>
</div>

<hr>

<strong>Taxes & Costs</strong>
<div class="row">
<div class="col"><label>Property Tax (%/yr)</label><input id="tax" value="1.2"></div>
<div class="col"><label>Insurance (annual)</label><input id="insurance" value="1500"></div>
</div>

<div class="row">
<div class="col"><label>PMI (annual)</label><input id="pmi" value="0"></div>
<div class="col"><label>HOA (annual)</label><input id="hoa" value="0"></div>
</div>

<hr>

<strong>Extra Payments</strong>
<div class="row">
<div class="col"><label>Extra Monthly</label><input id="extraM" value="0"></div>
<div class="col"><label>Extra Yearly</label><input id="extraY" value="0"></div>
</div>

<div class="row">
<button class="btn primary" onclick="calculate()">Calculate</button>
<button class="btn alt" onclick="location.reload()">Reset</button>
<button class="btn alt" onclick="downloadCSV()">CSV</button>
<button class="btn alt" onclick="window.print()">Print</button>
</div>
</div>

<!-- RESULTS -->
<div class="card">
<div class="row">
<div>
<div class="summary">Loan Payment</div>
<h2 id="loanPay">$0</h2>
<div class="summary">Housing Cost: <strong id="housePay">$0</strong></div>
</div>
<div class="summary">
<div>Total Paid: <strong id="totalPaid">$0</strong></div>
<div>Total Interest: <strong id="totalInt">$0</strong></div>
<div>Payoff: <strong id="payoff">—</strong></div>
</div>
</div>

<div class="chartBox"><canvas id="chart"></canvas></div>

<div class="toggle">
<button id="mBtn" class="active" onclick="showMonthly()">Monthly</button>
<button id="aBtn" onclick="showAnnual()">Annual</button>
</div>

<div class="scroll" id="monthlyWrap"></div>
<div class="scroll" id="annualWrap" style="display:none"></div>

</div>
</div>
</div>

<script>
let chart;

function fmt(n){
 const c=document.getElementById("currency").value;
 return new Intl.NumberFormat("en",{style:"currency",currency:c}).format(n);
}

function calculate(){
 const P=document.getElementById("price").value*(1-document.getElementById("down").value/100);
 const r=document.getElementById("rate").value/100/12;
 const n=document.getElementById("years").value*12;

 const tax=P*(document.getElementById("tax").value/100)/12;
 const ins=document.getElementById("insurance").value/12;
 const pmi=document.getElementById("pmi").value/12;
 const hoa=document.getElementById("hoa").value/12;

 const extraM=+document.getElementById("extraM").value;
 const extraY=+document.getElementById("extraY").value;

 const pay=P*r/(1-Math.pow(1+r,-n));

 let bal=P,rows="",annual={},labels=[],data=[];
 let totalPay=0,totalInt=0,month=0;

 while(bal>0 && month<1000){
  month++;
  const interest=bal*r;
  let principal=pay-interest;
  let extra=extraM+(month%12===1?extraY:0);
  if(principal+extra>bal) extra=bal-principal;
  bal-=principal+extra;

  totalPay+=pay+extra;
  totalInt+=interest;

  labels.push("M"+month);
  data.push(bal);

  rows+=`<tr><td>${month}</td><td>${fmt(pay+extra)}</td><td>${fmt(interest)}</td><td>${fmt(bal)}</td></tr>`;

  const y=Math.ceil(month/12);
  annual[y]=bal;
 }

 document.getElementById("loanPay").textContent=fmt(pay);
 document.getElementById("housePay").textContent=fmt(pay+tax+ins+pmi+hoa);
 document.getElementById("totalPaid").textContent=fmt(totalPay);
 document.getElementById("totalInt").textContent=fmt(totalInt);
 document.getElementById("payoff").textContent=`${Math.ceil(month/12)} yrs`;

 document.getElementById("monthlyWrap").innerHTML=
 `<table><thead><tr><th>#</th><th>Payment</th><th>Interest</th><th>Balance</th></tr></thead><tbody>${rows}</tbody></table>`;

 let aRows="";
 Object.keys(annual).forEach(y=>{
  aRows+=`<tr><td>Year ${y}</td><td>${fmt(annual[y])}</td></tr>`;
 });
 document.getElementById("annualWrap").innerHTML=
 `<table><thead><tr><th>Year</th><th>Ending Balance</th></tr></thead><tbody>${aRows}</tbody></table>`;

 if(chart) chart.destroy();
 chart=new Chart(document.getElementById("chart"),{
  type:"line",
  data:{labels,datasets:[{data,borderColor:"#1f6fb6",fill:true,backgroundColor:"rgba(31,111,182,.1)",pointRadius:0}]},
  options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}}}
 });
}

function showMonthly(){
 document.getElementById("monthlyWrap").style.display="";
 document.getElementById("annualWrap").style.display="none";
 mBtn.classList.add("active");aBtn.classList.remove("active");
}
function showAnnual(){
 document.getElementById("monthlyWrap").style.display="none";
 document.getElementById("annualWrap").style.display="";
 aBtn.classList.add("active");mBtn.classList.remove("active");
}

function downloadCSV(){
 const rows=[...document.querySelectorAll("#monthlyWrap tr")].map(r=>[...r.children].map(c=>c.innerText).join(",")).join("\n");
 const b=new Blob([rows],{type:"text/csv"});
 const a=document.createElement("a");
 a.href=URL.createObjectURL(b);
 a.download="mortgage.csv";
 a.click();
}

calculate();
</script>
</body>
</html>
