<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mortgage Calculator</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
:root{
  --bg:#f6fbff;
  --card:#ffffff;
  --primary:#1f6fb6;
  --border:#e6eef6;
  --muted:#6b7280;
  --radius:14px;
  --shadow:0 10px 30px rgba(0,0,0,.06);
}

*{box-sizing:border-box}
body{
  margin:0;
  font-family:Inter,system-ui,Arial;
  background:var(--bg);
  color:#111;
}

.container{
  max-width:1200px;
  margin:auto;
  padding:16px;
}

h1{
  margin:0;
  color:var(--primary);
}

.sub{
  color:var(--muted);
  font-size:14px;
  margin-bottom:16px;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:22px;
}

.card{
  background:var(--card);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:20px;
}

.section{
  margin-bottom:22px;
}

.section h3{
  margin:0 0 12px;
  font-size:15px;
  color:var(--primary);
}

.form-group{
  margin-bottom:14px;
}

label{
  display:block;
  font-size:13px;
  color:var(--muted);
  margin-bottom:6px;
}

input,select{
  width:100%;
  padding:12px;
  border-radius:10px;
  border:1px solid var(--border);
  font-size:15px;
}

.row{
  display:flex;
  gap:12px;
}

.row > div{flex:1}

hr{
  border:none;
  border-top:1px solid var(--border);
  margin:20px 0;
}

button{
  padding:12px 16px;
  border-radius:10px;
  border:none;
  font-weight:600;
  cursor:pointer;
}

.primary{background:var(--primary);color:#fff}
.ghost{background:#eef6fb;color:var(--primary)}

.stats{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:14px;
}

.stat{
  background:#f8fbff;
  border-radius:12px;
  padding:14px;
}

.stat small{
  color:var(--muted);
  font-size:12px;
}

.stat b{
  font-size:20px;
  display:block;
  margin-top:4px;
}

.chart-box{
  height:260px;
  margin-top:12px;
}

.table-wrap{
  max-height:420px;
  overflow:auto;
  border:1px solid var(--border);
  border-radius:12px;
  margin-top:12px;
}

table{
  width:100%;
  border-collapse:collapse;
  font-size:14px;
}

th,td{
  padding:10px;
  border-bottom:1px solid var(--border);
  text-align:right;
}

th:first-child,td:first-child{text-align:center}

thead{
  background:#1f6fb6;
  color:#fff;
  position:sticky;
  top:0;
}

@media(max-width:900px){
  .grid{grid-template-columns:1fr}
}
</style>
</head>

<body>
<div class="container">
  <h1>Mortgage Calculator</h1>
  <div class="sub">Monthly payment, amortization, charts & printable results</div>

  <div class="grid">

    <!-- LEFT -->
    <div class="card">

      <div class="section">
        <h3>Currency</h3>
        <select id="currency">
          <option value="USD">USD ($)</option>
          <option value="EUR">EUR (€)</option>
          <option value="GBP">GBP (£)</option>
        </select>
      </div>

      <div class="section">
        <h3>Loan Details</h3>

        <div class="form-group">
          <label>Home Price</label>
          <input id="price" value="400000" type="number">
        </div>

        <div class="row">
          <div class="form-group">
            <label>Down Payment (%)</label>
            <input id="down" value="20" type="number">
          </div>
          <div class="form-group">
            <label>Loan Term (years)</label>
            <input id="years" value="30" type="number">
          </div>
        </div>

        <div class="form-group">
          <label>Interest Rate (%)</label>
          <input id="rate" value="6.228" type="number" step="0.001">
        </div>
      </div>

      <hr>

      <div class="section">
        <h3>Taxes & Insurance</h3>

        <div class="row">
          <div class="form-group">
            <label>Property Tax (% / yr)</label>
            <input id="tax" value="1.2" type="number">
          </div>
          <div class="form-group">
            <label>Insurance (annual)</label>
            <input id="insurance" value="1500" type="number">
          </div>
        </div>

        <div class="row">
          <div class="form-group">
            <label>PMI (annual)</label>
            <input id="pmi" value="0" type="number">
          </div>
          <div class="form-group">
            <label>HOA (annual)</label>
            <input id="hoa" value="0" type="number">
          </div>
        </div>

        <div class="form-group">
          <label>Other Costs (annual)</label>
          <input id="other" value="4000" type="number">
        </div>
      </div>

      <hr>

      <div class="section">
        <h3>Extra Payments</h3>

        <div class="form-group">
          <label>Extra Monthly</label>
          <input id="extra" value="0" type="number">
        </div>
      </div>

      <button class="primary" onclick="calc()">Calculate</button>
      <button class="ghost" onclick="location.reload()">Reset</button>
    </div>

    <!-- RIGHT -->
    <div class="card">

      <div class="stats">
        <div class="stat">
          <small>Monthly Payment</small>
          <b id="mp">$0</b>
        </div>
        <div class="stat">
          <small>Total Interest</small>
          <b id="ti">$0</b>
        </div>
      </div>

      <div class="chart-box">
        <canvas id="chart"></canvas>
      </div>

      <h3>Amortization Schedule</h3>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>#</th>
              <th>Payment</th>
              <th>Interest</th>
              <th>Balance</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>

    </div>

  </div>
</div>

<script>
let chart;

function fmt(n){
  return new Intl.NumberFormat("en-US",{style:"currency",currency:"USD"}).format(n);
}

function calc(){
  let P = price.value * (1 - down.value/100);
  let r = rate.value/100/12;
  let n = years.value*12;

  let m = P * (r / (1 - Math.pow(1+r,-n)));
  mp.textContent = fmt(m);

  let bal = P, tiSum=0, rows="", data=[];

  for(let i=1;i<=n;i++){
    let interest = bal*r;
    let principal = m - interest;
    bal -= principal;
    tiSum += interest;

    if(i<=36){
      rows += `<tr>
        <td>${i}</td>
        <td>${fmt(m)}</td>
        <td>${fmt(interest)}</td>
        <td>${fmt(Math.max(0,bal))}</td>
      </tr>`;
    }
    data.push(bal);
  }

  ti.textContent = fmt(tiSum);
  document.getElementById("rows").innerHTML = rows;

  chart?.destroy();
  chart = new Chart(chartCanvas,{
    type:"line",
    data:{
      labels:data.map((_,i)=>i+1),
      datasets:[{data, borderColor:"#1f6fb6", fill:true}]
    },
    options:{responsive:true,maintainAspectRatio:false}
  });
}
calc();
</script>
</body>
</html>
