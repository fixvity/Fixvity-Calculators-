<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mortgage Calculator</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
:root{
  --bg:#f6fbff;
  --card:#ffffff;
  --primary:#1f6fb6;
  --border:#e6eef6;
  --muted:#6b7280;
  --radius:14px;
  --shadow:0 10px 30px rgba(0,0,0,.06);
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Inter,system-ui,Arial;
  background:var(--bg);
}
.container{
  max-width:1200px;
  margin:auto;
  padding:16px;
}
h1{color:var(--primary);margin-bottom:4px}
.sub{color:var(--muted);font-size:14px;margin-bottom:16px}
.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:22px;
}
.card{
  background:var(--card);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:20px;
}
.section{margin-bottom:22px}
.section h3{
  margin:0 0 12px;
  font-size:15px;
  color:var(--primary);
}
label{
  font-size:13px;
  color:var(--muted);
  margin-bottom:6px;
  display:block;
}
input{
  width:100%;
  padding:12px;
  border-radius:10px;
  border:1px solid var(--border);
}
.row{display:flex;gap:12px}
.row>div{flex:1}
button{
  padding:12px 16px;
  border-radius:10px;
  border:none;
  font-weight:600;
  cursor:pointer;
}
.primary{background:var(--primary);color:#fff}
.ghost{background:#eef6fb;color:var(--primary)}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:14px;
  margin-bottom:16px;
}
.stat{
  background:#f8fbff;
  border-radius:12px;
  padding:14px;
}
.stat small{color:var(--muted);font-size:12px}
.stat b{font-size:20px;display:block;margin-top:4px}

.chart-box{height:260px;margin-bottom:16px}

.toggle{
  display:flex;
  gap:8px;
  margin-bottom:10px;
}
.toggle button{
  padding:6px 12px;
  border-radius:8px;
  border:1px solid var(--border);
  background:#f8fbff;
}
.toggle .active{
  background:var(--primary);
  color:#fff;
}

.table-wrap{
  max-height:420px;
  overflow:auto;
  border:1px solid var(--border);
  border-radius:12px;
}
table{
  width:100%;
  border-collapse:collapse;
  font-size:14px;
}
th,td{
  padding:10px;
  border-bottom:1px solid var(--border);
  text-align:right;
}
th:first-child,td:first-child{text-align:center}
thead{
  background:var(--primary);
  color:#fff;
  position:sticky;
  top:0;
}

@media(max-width:900px){
  .grid{grid-template-columns:1fr}
}
</style>
</head>

<body>
<div class="container">
<h1>Mortgage Calculator</h1>
<div class="sub">Monthly payment, amortization, charts & printable results</div>

<div class="grid">

<!-- LEFT -->
<div class="card">
  <div class="section">
    <h3>Loan Details</h3>
    <label>Home Price</label>
    <input id="price" type="number" value="400000">

    <div class="row">
      <div>
        <label>Down Payment (%)</label>
        <input id="down" type="number" value="20">
      </div>
      <div>
        <label>Loan Term (years)</label>
        <input id="years" type="number" value="30">
      </div>
    </div>

    <label>Interest Rate (%)</label>
    <input id="rate" type="number" value="6.228" step="0.001">
  </div>

  <div class="section">
    <h3>Taxes & Insurance</h3>
    <div class="row">
      <div>
        <label>Property Tax (% / yr)</label>
        <input id="tax" type="number" value="1.2">
      </div>
      <div>
        <label>Insurance (annual)</label>
        <input id="insurance" type="number" value="1500">
      </div>
    </div>
  </div>

  <div class="section">
    <h3>Extra Payments</h3>
    <label>Extra Monthly</label>
    <input id="extra" type="number" value="0">
  </div>

  <button class="primary" onclick="calculate()">Calculate</button>
  <button class="ghost" onclick="location.reload()">Reset</button>
</div>

<!-- RIGHT -->
<div class="card">

  <div class="stats">
    <div class="stat"><small>Monthly Payment</small><b id="mp">$0</b></div>
    <div class="stat"><small>Total Interest</small><b id="ti">$0</b></div>
    <div class="stat"><small>Payoff Time</small><b id="po">—</b></div>
  </div>

  <div class="chart-box">
    <canvas id="balanceChart"></canvas>
  </div>

  <div class="toggle">
    <button id="mBtn" class="active" onclick="showMonthly()">Monthly</button>
    <button id="yBtn" onclick="showYearly()">Yearly</button>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>Payment</th>
          <th>Principal</th>
          <th>Interest</th>
          <th>Balance</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </div>

</div>
</div>
</div>

<script>
let chart, monthlyRows="", yearlyRows="", monthlyBalances=[], yearlyBalances=[];

const fmt = n => new Intl.NumberFormat("en-US",{style:"currency",currency:"USD"}).format(n);

function calculate(){
  let home = +price.value;
  let downPct = +down.value/100;
  let loan = home*(1-downPct);
  let r = +rate.value/100/12;
  let n = +years.value*12;
  let extra = +extra.value;

  let annualTax = loan*(+tax.value/100);
  let monthlyTax = annualTax/12;
  let monthlyInsurance = +insurance.value/12;

  let basePayment = loan*(r/(1-Math.pow(1+r,-n)));
  let payment = basePayment + monthlyTax + monthlyInsurance + extra;

  let bal=loan, totalInterest=0;
  monthlyRows=""; yearlyRows="";
  monthlyBalances=[]; yearlyBalances=[];

  let yInt=0, yPrin=0, yPay=0;

  for(let i=1;i<=n;i++){
    let interest = bal*r;
    let principal = basePayment - interest + extra;
    if(principal>bal) principal=bal;
    bal-=principal;

    totalInterest+=interest;
    monthlyBalances.push(bal);

    monthlyRows+=`
    <tr>
      <td>${i}</td>
      <td>${fmt(payment)}</td>
      <td>${fmt(principal)}</td>
      <td>${fmt(interest)}</td>
      <td>${fmt(Math.max(0,bal))}</td>
    </tr>`;

    yInt+=interest; yPrin+=principal; yPay+=payment;

    if(i%12===0){
      yearlyBalances.push(bal);
      yearlyRows+=`
      <tr>
        <td>${i/12}</td>
        <td>${fmt(yPay)}</td>
        <td>${fmt(yPrin)}</td>
        <td>${fmt(yInt)}</td>
        <td>${fmt(Math.max(0,bal))}</td>
      </tr>`;
      yInt=yPrin=yPay=0;
    }
    if(bal<=0)break;
  }

  mp.textContent=fmt(payment);
  ti.textContent=fmt(totalInterest);
  po.textContent=Math.floor(monthlyBalances.length/12)+" yrs "+(monthlyBalances.length%12)+" mo";

  showMonthly();
  renderChart(monthlyBalances);
}

function renderChart(data){
  chart?.destroy();
  chart=new Chart(balanceChart,{
    type:"line",
    data:{labels:data.map((_,i)=>i+1),
    datasets:[{data,borderColor:"#1f6fb6",fill:true}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}}}
  });
}

function showMonthly(){
  rows.innerHTML=monthlyRows;
  mBtn.classList.add("active"); yBtn.classList.remove("active");
}
function showYearly(){
  rows.innerHTML=yearlyRows;
  yBtn.classList.add("active"); mBtn.classList.remove("active");
}

calculate();
</script>
</body>
</html>
