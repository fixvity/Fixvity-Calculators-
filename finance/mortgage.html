<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Mortgage Calculator</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
:root{
  --primary:#2563eb;
  --bg:#f4f7fb;
  --card:#ffffff;
  --text:#111827;
  --muted:#6b7280;
  --radius:14px;
  --shadow:0 8px 28px rgba(0,0,0,.08);
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Inter,system-ui,Arial;
  background:var(--bg);
  color:var(--text);
}
.container{
  max-width:1100px;
  margin:auto;
  padding:16px;
}

/* HEADER */
.header{
  background:var(--card);
  padding:22px;
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  text-align:center;
}
.header h1{margin:0;color:var(--primary)}
.header p{margin-top:6px;color:var(--muted)}

/* TABS */
.tabs{
  display:flex;
  margin-top:16px;
  background:var(--card);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
}
.tab{
  flex:1;
  padding:14px;
  border:none;
  background:none;
  font-weight:700;
  cursor:pointer;
  color:var(--muted);
}
.tab.active{
  background:var(--primary);
  color:#fff;
}

/* PANELS */
.panel{display:none;margin-top:18px}
.panel.active{display:block}

/* FORM */
.form-card{
  background:var(--card);
  padding:20px;
  border-radius:var(--radius);
  box-shadow:var(--shadow);
}
.field{margin-bottom:14px}
label{font-weight:600}
input{
  width:100%;
  padding:12px;
  margin-top:6px;
  border-radius:10px;
  border:1px solid #e5e7eb;
  font-size:15px;
}

/* BUTTONS */
.actions{
  display:grid;
  grid-template-columns:2fr 1fr;
  gap:12px;
}
button.primary{
  padding:14px;
  font-size:16px;
  font-weight:700;
  background:var(--primary);
  color:#fff;
  border:none;
  border-radius:12px;
  cursor:pointer;
}
button.clear{
  padding:14px;
  font-size:15px;
  font-weight:700;
  background:#e5e7eb;
  border:none;
  border-radius:12px;
  cursor:pointer;
}

/* HERO */
.hero{
  background:linear-gradient(135deg,#2563eb,#1e40af);
  color:#fff;
  padding:32px;
  border-radius:18px;
  text-align:center;
}
.hero h2{font-size:44px;margin:0}

/* BREAKDOWN */
.breakdown{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
  gap:14px;
  margin:20px 0;
}
.stat{
  background:var(--card);
  padding:14px;
  border-radius:12px;
  box-shadow:var(--shadow);
  text-align:center;
}
.stat small{color:var(--muted)}
.stat strong{
  display:block;
  font-size:20px;
  margin-top:4px;
}

/* CHARTS */
.charts{
  display:grid;
  grid-template-columns:1fr;
  gap:18px;
}
.chart{
  background:var(--card);
  padding:16px;
  border-radius:var(--radius);
  box-shadow:var(--shadow);
}

/* AMORTIZATION */
.table-card{
  background:var(--card);
  padding:18px;
  border-radius:var(--radius);
  box-shadow:var(--shadow);
}
.toggle{
  display:flex;
  gap:10px;
  margin-bottom:10px;
}
.toggle button{
  padding:8px 14px;
  border-radius:8px;
  border:none;
  font-weight:700;
  cursor:pointer;
}
.toggle .active{
  background:var(--primary);
  color:#fff;
}

.table-wrap{
  max-height:420px;
  overflow:auto;
  border:1px solid #e5e7eb;
  border-radius:12px;
}
table{
  width:100%;
  min-width:650px;
  border-collapse:collapse;
}
th,td{
  padding:12px;
  border-bottom:1px solid #e5e7eb;
  text-align:center;
  vertical-align:middle;
}
th{
  background:var(--primary);
  color:#fff;
  position:sticky;
  top:0;
}

@media(min-width:900px){
  .charts{grid-template-columns:2fr 1fr}
}
</style>
</head>

<body>
<div class="container">

<div class="header">
<h1>Mortgage Calculator</h1>
<p>Advanced mortgage calculator with charts, amortization & exports.</p>
</div>

<div class="tabs">
<button class="tab active" onclick="showTab(0)">Define</button>
<button class="tab" onclick="showTab(1)">Calculate</button>
<button class="tab" onclick="showTab(2)">More</button>
</div>

<!-- DEFINE -->
<div class="panel active">
<div class="form-card">

<div class="field"><label>Home Price</label><input id="home" value="400000"></div>
<div class="field"><label>Down Payment</label><input id="down" value="30000"></div>
<div class="field"><label>Interest Rate (%)</label><input id="rate" value="6.5"></div>
<div class="field"><label>Loan Term (Years)</label><input id="years" value="30"></div>
<div class="field"><label>Property Tax (Monthly)</label><input id="tax" value="250"></div>
<div class="field"><label>Insurance (Monthly)</label><input id="ins" value="120"></div>
<div class="field"><label>PMI Rate (% Annual)</label><input id="pmi" value="0.5"></div>
<div class="field"><label>HOA (Monthly)</label><input id="hoa" value="0"></div>

<div class="actions">
<button class="primary" onclick="calculate()">Calculate Mortgage</button>
<button class="clear" onclick="clearAll()">Clear</button>
</div>

</div>
</div>

<!-- CALCULATE -->
<div class="panel">
<div class="hero">
<h2 id="monthly">$0</h2>
Monthly Payment
</div>

<div class="breakdown" id="breakdown"></div>

<div class="charts">
<div class="chart"><canvas id="lineChart"></canvas></div>
<div class="chart"><canvas id="pieChart"></canvas></div>
</div>
</div>

<!-- MORE -->
<div class="panel">
<div class="table-card">
<h2>Amortization Schedule</h2>

<div class="toggle">
<button class="active" onclick="setView('monthly',this)">Monthly</button>
<button onclick="setView('yearly',this)">Yearly</button>
</div>

<div class="table-wrap">
<table>
<thead>
<tr>
<th>Period</th>
<th>Principal</th>
<th>Interest</th>
<th>Balance</th>
</tr>
</thead>
<tbody id="table"></tbody>
</table>
</div>

</div>
</div>

</div>

<script>
let amort=[],view="monthly",line,pie;
const fmt=n=>"$"+Math.round(n).toLocaleString();

function showTab(i){
document.querySelectorAll(".tab").forEach((t,x)=>t.classList.toggle("active",x===i));
document.querySelectorAll(".panel").forEach((p,x)=>p.classList.toggle("active",x===i));
}

function calculate(){
const price=+home.value;
const downPay=+down.value;
const loan=price-downPay;
const r=rate.value/100/12;
const n=years.value*12;

const pi=loan*r/(1-Math.pow(1+r,-n));
const taxM=+tax.value;
const insM=+ins.value;
const hoaM=+hoa.value;
const ltv=loan/price;
const pmiM=ltv>0.8 ? loan*(pmi.value/100)/12 : 0;

const total=pi+taxM+insM+hoaM+pmiM;
monthly.textContent=fmt(total);

breakdown.innerHTML=`
<div class="stat"><small>P&I</small><strong>${fmt(pi)}</strong></div>
<div class="stat"><small>Tax</small><strong>${fmt(taxM)}</strong></div>
<div class="stat"><small>Insurance</small><strong>${fmt(insM)}</strong></div>
<div class="stat"><small>PMI</small><strong>${fmt(pmiM)}</strong></div>
<div class="stat"><small>HOA</small><strong>${fmt(hoaM)}</strong></div>
`;

amort=[];
let bal=loan;
for(let i=1;i<=n;i++){
let interest=bal*r;
let principal=pi-interest;
bal-=principal;
amort.push({i,principal,interest,balance:Math.max(bal,0)});
}

drawCharts(pi,taxM,insM,pmiM,hoaM);
renderTable();
showTab(1);
}

function drawCharts(pi,tax,ins,pmi,hoa){
line?.destroy(); pie?.destroy();

line=new Chart(lineChart,{
type:"line",
data:{
labels:amort.filter((_,i)=>i%12===0).map((_,i)=>`Year ${i+1}`),
datasets:[{
label:"Remaining Balance",
data:amort.filter((_,i)=>i%12===0).map(x=>x.balance),
borderColor:"#2563eb",
fill:true
}]
}
});

pie=new Chart(pieChart,{
type:"doughnut",
data:{
labels:["P&I","Tax","Insurance","PMI","HOA"],
datasets:[{
data:[pi,tax,ins,pmi,hoa],
backgroundColor:["#2563eb","#16a34a","#0ea5e9","#f59e0b","#6b7280"]
}]
}
});
}

function setView(v,btn){
view=v;
document.querySelectorAll(".toggle button").forEach(b=>b.classList.remove("active"));
btn.classList.add("active");
renderTable();
}

function renderTable(){
table.innerHTML="";
if(view==="monthly"){
amort.forEach(x=>{
table.innerHTML+=`<tr>
<td>Month ${x.i}</td>
<td>${fmt(x.principal)}</td>
<td>${fmt(x.interest)}</td>
<td>${fmt(x.balance)}</td>
</tr>`;
});
}else{
let p=0,i=0,y=1;
amort.forEach((x,idx)=>{
p+=x.principal;i+=x.interest;
if((idx+1)%12===0){
table.innerHTML+=`<tr>
<td>Year ${y++}</td>
<td>${fmt(p)}</td>
<td>${fmt(i)}</td>
<td>${fmt(x.balance)}</td>
</tr>`;
p=i=0;
}
});
}
}

function clearAll(){
document.querySelectorAll("input").forEach(i=>i.value="");
monthly.textContent="$0";
breakdown.innerHTML="";
table.innerHTML="";
line?.destroy(); pie?.destroy();
showTab(0);
}
</script>

</body>
</html>
