<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Mortgage Calculator</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{
  margin:0;
  font-family:Inter,system-ui,Arial;
  background:#f2f5f9;
  color:#1f2937;
}
.container{max-width:1200px;margin:auto;padding:20px}

/* HEADER */
.header{
  background:#fff;
  padding:24px;
  border-radius:14px;
  box-shadow:0 10px 30px rgba(0,0,0,.08);
  text-align:center;
}
.header h1{margin:0;color:#2c5aa0}
.header p{margin-top:8px;color:#6b7280}

/* TABS */
.tabs{
  display:flex;
  margin-top:18px;
  background:#fff;
  border-radius:12px;
  box-shadow:0 8px 24px rgba(0,0,0,.08);
}
.tab{
  flex:1;
  padding:16px;
  border:none;
  background:none;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
  color:#6b7280;
}
.tab.active{background:#2c5aa0;color:#fff}

/* PANELS */
.panel{display:none;margin-top:20px}
.panel.active{display:block}

/* DEFINE */
.define-grid{
  background:#fff;
  padding:24px;
  border-radius:14px;
  box-shadow:0 10px 30px rgba(0,0,0,.08);
}
.input{margin-bottom:18px}
label{font-weight:600}
input[type=range],input[type=date],select{
  width:100%;
  margin-top:6px;
}
.value{text-align:center;font-weight:700;color:#2c5aa0;margin-top:4px}

/* BUTTONS */
.actions{display:flex;gap:16px;margin-top:20px}
button.main{
  flex:2;
  background:#2c5aa0;
  color:#fff;
  border:none;
  padding:14px;
  font-size:16px;
  font-weight:700;
  border-radius:10px;
  cursor:pointer;
}
button.reset{
  flex:1;
  background:#eef2f7;
  border:none;
  padding:14px;
  font-weight:700;
  border-radius:10px;
}

/* CALCULATE */
.hero{
  background:linear-gradient(135deg,#2c5aa0,#1e3a8a);
  color:#fff;
  padding:36px;
  border-radius:18px;
  text-align:center;
  box-shadow:0 14px 40px rgba(0,0,0,.25);
}
.hero h2{font-size:54px;margin:0}

.breakdown{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:16px;
  margin:24px 0;
}
.box{
  background:#fff;
  padding:18px;
  border-radius:12px;
  box-shadow:0 6px 18px rgba(0,0,0,.08);
}
.box small{color:#6b7280}
.box strong{font-size:20px}

/* CHARTS */
.charts{
  display:grid;
  grid-template-columns:2fr 1fr;
  gap:20px;
}
.chart{
  background:#fff;
  padding:20px;
  border-radius:14px;
  box-shadow:0 6px 20px rgba(0,0,0,.08);
}
canvas{height:260px!important}

/* MORE */
.more-card{
  background:#fff;
  padding:24px;
  border-radius:14px;
  box-shadow:0 10px 30px rgba(0,0,0,.08);
}
.table-wrap{
  max-height:420px;
  overflow:auto;
  margin-top:16px;
  border:1px solid #e5e7eb;
  border-radius:12px;
}
table{width:100%;border-collapse:collapse}
th{
  background:#2c5aa0;
  color:#fff;
  padding:12px;
  position:sticky;
  top:0;
}
td{padding:12px;border-bottom:1px solid #e5e7eb;text-align:right}
td:first-child{text-align:left}

/* RESPONSIVE */
@media(max-width:1000px){
  .breakdown{grid-template-columns:repeat(2,1fr)}
  .charts{grid-template-columns:1fr}
}
</style>
</head>

<body>
<div class="container">

<div class="header">
<h1>Mortgage Calculator</h1>
<p>The above tool estimates monthly mortgage payments with taxes, insurance, PMI, HOA fees & more.</p>
</div>

<div class="tabs">
<button class="tab active" onclick="show(0)">Define</button>
<button class="tab" onclick="show(1)">Calculate</button>
<button class="tab" onclick="show(2)">More</button>
</div>

<!-- DEFINE -->
<div class="panel active">
<div class="define-grid">

<div class="input">
<label>Currency</label>
<select><option>USD - US Dollar $</option></select>
</div>

<div class="input">
<label>Start Date</label>
<input type="date" id="start" value="2025-12-01">
</div>

<div class="input">
<label>Home Value</label>
<input type="range" id="home" min="50000" max="2000000" step="5000" value="400000">
<div class="value" id="homeV">$400,000</div>
</div>

<div class="input">
<label>Down Payment %</label>
<input type="range" id="down" min="0" max="50" step="0.5" value="20">
<div class="value" id="downV">20%</div>
</div>

<div class="input">
<label>Loan Term (years)</label>
<input type="range" id="years" min="5" max="40" value="30">
<div class="value" id="yearsV">30 years</div>
</div>

<div class="input">
<label>Interest Rate %</label>
<input type="range" id="rate" min="1" max="15" step="0.125" value="6.5">
<div class="value" id="rateV">6.5%</div>
</div>

<div class="input">
<label>Property Tax %</label>
<input type="range" id="tax" min="0" max="5" step="0.1" value="1.2">
<div class="value" id="taxV">1.2%</div>
</div>

<div class="input">
<label>PMI Rate %</label>
<input type="range" id="pmi" min="0" max="2" step="0.1" value="0.5">
<div class="value" id="pmiV">0.5%</div>
</div>

<div class="input">
<label>Home Insurance (annual)</label>
<input type="range" id="ins" min="0" max="5000" step="100" value="1200">
<div class="value" id="insV">$1,200</div>
</div>

<div class="input">
<label>HOA Fees (monthly)</label>
<input type="range" id="hoa" min="0" max="1000" step="25" value="0">
<div class="value" id="hoaV">$0</div>
</div>

<div class="actions">
<button class="main" onclick="calculate()">Calculate Payment</button>
<button class="reset" onclick="location.reload()">Reset</button>
</div>

</div>
</div>

<!-- CALCULATE -->
<div class="panel">
<div class="hero">
<h2 id="monthly">$0</h2>
Monthly Payment
</div>

<div class="breakdown" id="breakdown"></div>

<div class="charts">
<div class="chart"><canvas id="line"></canvas></div>
<div class="chart"><canvas id="pie"></canvas></div>
</div>
</div>

<!-- MORE -->
<div class="panel">
<div class="more-card">
<h2>Amortization Tables</h2>

<div class="table-wrap">
<table>
<thead>
<tr><th>Period</th><th>Principal</th><th>Interest</th><th>Balance</th></tr>
</thead>
<tbody id="table"></tbody>
</table>
</div>

</div>
</div>

</div>

<script>
const f=n=>"$"+Math.round(n).toLocaleString();
let amort=[],lineChart,pieChart;

["home","down","years","rate","tax","pmi","ins","hoa"].forEach(id=>{
document.getElementById(id).oninput=e=>{
document.getElementById(id+"V").textContent=
id==="home"||id==="ins"||id==="hoa"?f(e.target.value):
id==="years"?e.target.value+" years":e.target.value+"%";
};
});

function show(i){
document.querySelectorAll(".tab").forEach((t,x)=>t.classList.toggle("active",x===i));
document.querySelectorAll(".panel").forEach((p,x)=>p.classList.toggle("active",x===i));
}

function calculate(){
const home=+home.value;
const loan=home*(1-down.value/100);
const r=rate.value/100/12;
const n=years.value*12;
const pi=loan*r/(1-Math.pow(1+r,-n));
const taxM=home*(tax.value/100)/12;
const pmiM=loan/home>0.8?loan*(pmi.value/100)/12:0;
const insM=ins.value/12;
const hoaM=+hoa.value;
const total=pi+taxM+pmiM+insM+hoaM;

monthly.textContent=f(total);

breakdown.innerHTML=`
<div class="box"><small>P&I</small><strong>${f(pi)}</strong></div>
<div class="box"><small>Property Tax</small><strong>${f(taxM)}</strong></div>
<div class="box"><small>PMI</small><strong>${f(pmiM)}</strong></div>
<div class="box"><small>Insurance</small><strong>${f(insM)}</strong></div>
<div class="box"><small>HOA</small><strong>${f(hoaM)}</strong></div>`;

amort=[];let bal=loan;
for(let i=1;i<=n;i++){
let interest=bal*r;
let principal=pi-interest;
bal-=principal;
amort.push({i,principal,interest,balance:Math.max(bal,0)});
}

drawCharts(pi,taxM,pmiM,insM,hoaM);
renderTable();
show(1);
}

function drawCharts(pi,tax,pmi,ins,hoa){
lineChart?.destroy();pieChart?.destroy();

lineChart=new Chart(line,{
type:"line",
data:{
labels:amort.filter((_,i)=>i%12===0).map((_,i)=>"Year "+i),
datasets:[{data:amort.filter((_,i)=>i%12===0).map(x=>x.balance),borderColor:"#2c5aa0",fill:true}]
}
});

pieChart=new Chart(pie,{
type:"doughnut",
data:{
labels:["P&I","Tax","PMI","Insurance","HOA"],
datasets:[{data:[pi,tax,pmi,ins,hoa],backgroundColor:["#2c5aa0","#22c55e","#f59e0b","#06b6d4","#6b7280"]}]
}
});
}

function renderTable(){
table.innerHTML="";
amort.forEach((x,i)=>{
if(i<360){
table.innerHTML+=`<tr><td>Month ${i+1}</td><td>${f(x.principal)}</td><td>${f(x.interest)}</td><td>${f(x.balance)}</td></tr>`;
}
});
}
</script>
</body>
</html>
