<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Mortgage Calculator - m.mortgagecalculator.org</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
:root{
  --primary:#2c5aa0;
  --success:#28a745;
  --info:#17a2b8;
  --warning:#ffc107;
  --danger:#dc3545;
  --light:#f8f9fa;
  --dark:#343a40;
  --white:#ffffff;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  background:#f5f7fa;
  color:#333;
  line-height:1.5;
}
.container{max-width:1000px;margin:auto;padding:15px}
.header{
  text-align:center;
  margin-bottom:25px;
  padding:20px;
  background:#fff;
  border-radius:12px;
  box-shadow:0 2px 10px rgba(0,0,0,.08)
}
.header h1{color:var(--primary);font-size:28px;margin-bottom:6px}
.header p{color:#666;font-size:15px}

.tabs{
  display:flex;
  background:#fff;
  border-radius:12px 12px 0 0;
  overflow:hidden;
}
.tab-btn{
  flex:1;
  padding:16px;
  border:none;
  background:none;
  font-size:16px;
  font-weight:600;
  cursor:pointer;
  color:#666;
}
.tab-btn.active{background:var(--primary);color:#fff}

.tab-panel{
  display:none;
  background:#fff;
  padding:25px;
  border-radius:0 0 12px 12px;
  box-shadow:0 2px 10px rgba(0,0,0,.08);
  margin-bottom:20px
}
.tab-panel.active{display:block}

.inputs-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
  gap:20px;
}
.input-group{display:flex;flex-direction:column}
.input-label{font-weight:600;font-size:14px;margin-bottom:6px;color:#555}
.range-value{text-align:center;font-weight:700;color:var(--primary);margin-top:8px}

input[type=range],input[type=number]{
  padding:12px;
  border-radius:8px;
  border:2px solid #e9ecef;
  font-size:15px
}

.btn-group{display:flex;gap:12px;justify-content:center;margin:25px 0}
.btn{
  padding:14px 28px;
  border-radius:8px;
  border:none;
  font-size:16px;
  font-weight:600;
  cursor:pointer
}
.btn-primary{background:var(--primary);color:#fff}
.btn-outline{background:none;border:2px solid var(--primary);color:var(--primary)}

.results-main{
  background:linear-gradient(135deg,var(--primary),#1e3a8a);
  color:#fff;
  padding:30px;
  border-radius:16px;
  text-align:center;
  box-shadow:0 8px 32px rgba(44,90,160,.3)
}
.monthly-payment{font-size:46px;font-weight:800}

.results-breakdown{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:15px;
  margin-top:20px
}
.breakdown-item{
  background:rgba(255,255,255,.15);
  padding:16px;
  border-radius:10px
}

.charts-row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:20px;
  margin-top:25px
}
.chart-container{
  background:#fff;
  padding:20px;
  border-radius:12px;
  height:300px
}

.amort-section{
  background:#fff;
  border-radius:12px;
  box-shadow:0 4px 20px rgba(0,0,0,.08)
}
.amort-header{
  padding:20px;
  background:#f8f9fa;
  display:flex;
  justify-content:space-between;
  align-items:center
}
.amort-tab{
  padding:12px 18px;
  border:none;
  background:none;
  font-weight:600;
  cursor:pointer
}
.amort-tab.active{background:var(--primary);color:#fff;border-radius:8px}

.table-wrapper{max-height:420px;overflow:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{
  background:var(--primary);
  color:#fff;
  padding:12px;
  position:sticky;
  top:0
}
td{padding:10px;border-bottom:1px solid #e9ecef}
tr:nth-child(even){background:#f8f9fa}

@media(max-width:768px){
  .charts-row{grid-template-columns:1fr}
}
</style>
</head>

<body>
<div class="container">

<div class="header">
  <h1>Mortgage Calculator</h1>
  <p>Monthly payment, amortization, charts & printable results</p>
</div>

<div class="tabs">
  <button class="tab-btn active" onclick="switchTab('define',event)">Define</button>
  <button class="tab-btn" onclick="switchTab('calc',event)">Calculate</button>
  <button class="tab-btn" onclick="switchTab('more',event)">More</button>
</div>

<!-- DEFINE -->
<div id="define" class="tab-panel active">

<div class="inputs-grid">
  <div class="input-group">
    <label class="input-label">Home Value</label>
    <input type="range" id="homeValue" min="50000" max="2000000" value="400000" step="5000" oninput="updateValue('homeValue',this.value)">
    <div class="range-value" id="homeValueVal">$400,000</div>
  </div>

  <div class="input-group">
    <label class="input-label">Down Payment %</label>
    <input type="range" id="downPayment" min="0" max="50" value="20" step="0.5" oninput="updateValue('downPayment',this.value)">
    <div class="range-value" id="downPaymentVal">20%</div>
  </div>

  <div class="input-group">
    <label class="input-label">Loan Term (years)</label>
    <input type="range" id="loanTerm" min="5" max="40" value="30" step="1" oninput="updateValue('loanTerm',this.value)">
    <div class="range-value" id="loanTermVal">30 years</div>
  </div>

  <div class="input-group">
    <label class="input-label">Interest Rate %</label>
    <input type="range" id="interestRate" min="1" max="20" value="6.5" step="0.125" oninput="updateValue('interestRate',this.value)">
    <div class="range-value" id="interestRateVal">6.5%</div>
  </div>
</div>

<div class="btn-group">
  <button class="btn btn-primary" onclick="calculateMortgage()">Calculate</button>
  <button class="btn btn-outline" onclick="resetCalculator()">Reset</button>
</div>
</div>

<!-- CALC -->
<div id="calc" class="tab-panel">
  <div class="results-main">
    <div class="monthly-payment" id="monthlyPayment">$0</div>
    Monthly Payment
  </div>

  <div class="results-breakdown" id="breakdown"></div>

  <div class="charts-row">
    <div class="chart-container"><canvas id="amortChart"></canvas></div>
    <div class="chart-container"><canvas id="donutChart"></canvas></div>
  </div>
</div>

<!-- MORE -->
<div id="more" class="tab-panel">
<div class="amort-section">
<div class="amort-header">
<h3>Amortization Schedule</h3>
<div>
<button class="amort-tab active" onclick="showAmort('yearly',event)">Yearly</button>
<button class="amort-tab" onclick="showAmort('monthly',event)">Monthly</button>
</div>
</div>
<div class="table-wrapper">
<table>
<thead>
<tr>
<th>Period</th>
<th>Principal</th>
<th>Interest</th>
<th>Balance</th>
</tr>
</thead>
<tbody id="amortBody"></tbody>
</table>
</div>
</div>
</div>

</div>

<script>
let amortChart, donutChart;
let currentAmortView='yearly';
let lastLoanData=null;

function formatCurrency(n){
  return '$'+Math.round(n).toLocaleString();
}

function updateValue(id,val){
  const el=document.getElementById(id+'Val');
  if(id==='homeValue') el.textContent='$'+Number(val).toLocaleString();
  else if(id==='loanTerm') el.textContent=val+' years';
  else el.textContent=val+'%';
}

function switchTab(tab,e){
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
  document.querySelectorAll('.tab-panel').forEach(p=>p.classList.remove('active'));
  e.target.classList.add('active');
  document.getElementById(tab).classList.add('active');
}

function calculateMortgage(){
  const home=+homeValue.value;
  const down=+downPayment.value/100;
  const years=+loanTerm.value*12;
  const rate=+interestRate.value/100/12;

  const loan=home*(1-down);
  const pi=loan*rate/(1-Math.pow(1+rate,-years));

  lastLoanData={loan,pi,rate,years};

  monthlyPayment.textContent=formatCurrency(pi);

  updateCharts(loan,pi,rate,years);
  updateAmortization();

  switchTab('calc',event);
}

function updateCharts(loan,pi,rate,periods){
  let balance=loan;
  const balances=[];
  for(let m=0;m<=periods;m++){
    if(m%12===0) balances.push(Math.max(balance,0));
    const interest=balance*rate;
    balance-=pi-interest;
  }

  amortChart?.destroy();
  amortChart=new Chart(amortChart.getContext('2d'),{
    type:'line',
    data:{labels:balances.map((_,i)=>'Year '+i),datasets:[{data:balances,borderColor:'#2c5aa0',fill:true}]},
    options:{responsive:true,maintainAspectRatio:false}
  });
}

function updateAmortization(){
  const tbody=document.getElementById('amortBody');
  tbody.innerHTML='';
  let {loan,pi,rate,years}=lastLoanData;
  let balance=loan;

  if(currentAmortView==='monthly'){
    for(let m=1;m<=years;m++){
      const interest=balance*rate;
      const principal=pi-interest;
      balance-=principal;
      tbody.innerHTML+=`<tr><td>M${m}</td><td>${formatCurrency(principal)}</td><td>${formatCurrency(interest)}</td><td>${formatCurrency(balance)}</td></tr>`;
      if(balance<=0)break;
    }
  }else{
    let yp=0,yi=0;
    for(let m=1;m<=years;m++){
      const interest=balance*rate;
      const principal=pi-interest;
      balance-=principal;
      yp+=principal; yi+=interest;
      if(m%12===0||m===years){
        tbody.innerHTML+=`<tr><td>Year ${Math.ceil(m/12)}</td><td>${formatCurrency(yp)}</td><td>${formatCurrency(yi)}</td><td>${formatCurrency(balance)}</td></tr>`;
        yp=yi=0;
      }
    }
  }
}

function showAmort(v,e){
  currentAmortView=v;
  document.querySelectorAll('.amort-tab').forEach(t=>t.classList.remove('active'));
  e.target.classList.add('active');
  updateAmortization();
}

function resetCalculator(){location.reload();}

calculateMortgage();
</script>
</body>
</html>
