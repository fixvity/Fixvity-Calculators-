<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mortgage Calculator</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
:root{
  --bg:#f6fafc;
  --card:#ffffff;
  --primary:#1f6fb6;
  --text:#111;
  --muted:#6b7280;
  --border:#e6eef6;
  --radius:14px;
  --shadow:0 10px 30px rgba(0,0,0,.06);
}

*{box-sizing:border-box}
body{
  margin:0;
  font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial;
  background:var(--bg);
  color:var(--text);
}

.container{
  max-width:1200px;
  margin:24px auto;
  padding:16px;
}

h1{
  margin:0 0 6px;
  color:var(--primary);
}

.subtitle{
  color:var(--muted);
  font-size:14px;
  margin-bottom:18px;
}

/* ===== SUMMARY BAR ===== */
.summary-bar{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
  margin-bottom:18px;
}

.summary{
  background:var(--card);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:14px;
  text-align:center;
}

.summary span{
  display:block;
  font-size:13px;
  color:var(--muted);
}

.summary strong{
  font-size:22px;
  color:var(--primary);
}

/* ===== MAIN GRID ===== */
.main{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:18px;
}

/* ===== CARDS ===== */
.card{
  background:var(--card);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:16px;
  min-height:100%;
}

.section-title{
  font-weight:700;
  margin:16px 0 8px;
}

/* ===== FORM ===== */
label{
  font-size:13px;
  color:var(--muted);
}

input,select{
  width:100%;
  padding:11px;
  border-radius:10px;
  border:1px solid var(--border);
  font-size:15px;
}

.grid-2{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.grid-3{
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  gap:10px;
}

.buttons{
  display:flex;
  gap:10px;
  margin-top:14px;
}

button{
  border:none;
  border-radius:10px;
  padding:10px 16px;
  font-weight:600;
  cursor:pointer;
}

.primary{
  background:var(--primary);
  color:white;
}

.secondary{
  background:#eef5fb;
  color:var(--primary);
}

/* ===== CHART ===== */
.chart-box{
  height:260px;
  margin-top:10px;
}

/* ===== AMORTIZATION ===== */
.amortization{
  margin-top:18px;
}

.toggle{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.toggle button{
  background:none;
  color:var(--primary);
}

table{
  width:100%;
  border-collapse:collapse;
  margin-top:10px;
}

th,td{
  padding:10px;
  border-bottom:1px solid var(--border);
  font-size:14px;
}

th{
  background:#f1f7fc;
  text-align:left;
}

@media(max-width:900px){
  .main{grid-template-columns:1fr}
  .summary-bar{grid-template-columns:1fr 1fr}
}
</style>
</head>

<body>
<div class="container">

<h1>Mortgage Calculator</h1>
<div class="subtitle">Monthly payment, amortization & chart</div>

<!-- SUMMARY -->
<div class="summary-bar">
  <div class="summary"><span>Monthly Payment</span><strong id="monthly">$0</strong></div>
  <div class="summary"><span>Total Interest</span><strong id="interest">$0</strong></div>
  <div class="summary"><span>Total Paid</span><strong id="total">$0</strong></div>
  <div class="summary"><span>Payoff Time</span><strong id="payoff">—</strong></div>
</div>

<div class="main">

<!-- INPUTS -->
<div class="card">
  <div class="grid-2">
    <div>
      <label>Home Price</label>
      <input id="price" type="number" value="400000">
    </div>
    <div>
      <label>Down Payment (%)</label>
      <input id="down" type="number" value="20">
    </div>
  </div>

  <div class="grid-2">
    <div>
      <label>Loan Term (years)</label>
      <input id="years" type="number" value="30">
    </div>
    <div>
      <label>Interest Rate (%)</label>
      <input id="rate" type="number" value="6.228" step="0.001">
    </div>
  </div>

  <div class="section-title">Taxes & Costs</div>
  <div class="grid-2">
    <div>
      <label>Property Tax (% / yr)</label>
      <input id="tax" type="number" value="1.2">
    </div>
    <div>
      <label>Insurance (annual)</label>
      <input id="insurance" type="number" value="1500">
    </div>
  </div>

  <div class="grid-2">
    <div>
      <label>PMI (annual)</label>
      <input id="pmi" type="number" value="0">
    </div>
    <div>
      <label>HOA (annual)</label>
      <input id="hoa" type="number" value="0">
    </div>
  </div>

  <div class="section-title">Extra Payments</div>
  <div class="grid-3">
    <div>
      <label>Monthly</label>
      <input id="extraM" type="number" value="0">
    </div>
    <div>
      <label>Yearly</label>
      <input id="extraY" type="number" value="0">
    </div>
    <div>
      <label>One-Time</label>
      <input id="extraO" type="number" value="0">
    </div>
  </div>

  <div class="buttons">
    <button class="primary" onclick="calculate()">Calculate</button>
    <button class="secondary" onclick="location.reload()">Reset</button>
  </div>
</div>

<!-- RESULTS -->
<div class="card">
  <div class="chart-box">
    <canvas id="chart"></canvas>
  </div>

  <div class="amortization">
    <div class="toggle">
      <strong>Amortization Schedule</strong>
      <button onclick="toggleTable()">Show / Hide</button>
    </div>
    <div id="tableWrap" style="display:none">
      <table id="table"></table>
    </div>
  </div>
</div>

</div>
</div>

<script>
let chart;

function calculate(){
  const price=+price.value;
  const downPct=+down.value/100;
  const loan=price*(1-downPct);
  const yearsN=+years.value;
  const rateN=+rate.value/100/12;
  const n=yearsN*12;

  const base=loan*(rateN/(1-Math.pow(1+rateN,-n)));
  const extraM=+extraM.value;

  let balance=loan,totalI=0;
  let rows=[];
  let balances=[];

  for(let i=1;i<=n;i++){
    let interest=balance*rateN;
    let principal=base-interest+extraM;
    if(principal>balance)principal=balance;
    balance-=principal;
    totalI+=interest;
    balances.push(balance);
    rows.push(`<tr><td>${i}</td><td>$${(base+extraM).toFixed(2)}</td><td>$${interest.toFixed(2)}</td><td>$${balance.toFixed(2)}</td></tr>`);
    if(balance<=0)break;
  }

  monthly.textContent="$"+(base+extraM).toFixed(2);
  interest.textContent="$"+totalI.toFixed(2);
  total.textContent="$"+(loan+totalI).toFixed(2);
  payoff.textContent=Math.ceil(rows.length/12)+" yrs";

  table.innerHTML="<tr><th>Month</th><th>Payment</th><th>Interest</th><th>Balance</th></tr>"+rows.join("");

  if(chart)chart.destroy();
  chart=new Chart(chart.getContext("2d"),{
    type:"line",
    data:{labels:balances.map((_,i)=>i+1),datasets:[{data:balances,label:"Balance",borderColor:"#1f6fb6",fill:true,backgroundColor:"rgba(31,111,182,.1)"}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}}}
  });
}

function toggleTable(){
  tableWrap.style.display=tableWrap.style.display==="none"?"block":"none";
}

calculate();
</script>

</body>
</html>
