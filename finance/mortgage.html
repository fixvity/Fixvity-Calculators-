<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mortgage Calculator – Pro</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
:root{
  --accent:#1f6fb6;--bg:#f7fbfd;--card:#fff;--muted:#6b7280;
  --radius:12px;--shadow:0 8px 28px rgba(10,20,30,.08);
}
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui;background:var(--bg);color:#111}
.wrap{max-width:1150px;margin:auto;padding:16px}
h1{color:var(--accent);margin:0}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:16px}
label{font-size:13px;color:var(--muted)}
input,select{width:100%;padding:12px;border-radius:10px;border:1px solid #e5edf4;font-size:15px}
.grid{display:grid;gap:18px}
@media(min-width:900px){.grid{grid-template-columns:1fr 420px}}

.btn{padding:10px 14px;border-radius:8px;border:none;background:var(--accent);color:#fff;font-weight:600;cursor:pointer}
.btn.alt{background:#eef6fb;color:var(--accent)}
.small{font-size:13px;color:var(--muted)}

.chartBox{height:260px}
table{width:100%;border-collapse:collapse}
th,td{padding:8px;border-bottom:1px solid #e8eef3;font-size:14px}
th{background:#2f6b9f;color:#fff}

@media print{
  button,.small{display:none}
  body{background:#fff}
}
</style>
</head>

<body>
<div class="wrap">
<h1>Mortgage Calculator</h1>
<p class="small">Monthly payment, amortization, charts & printable results</p>

<div class="grid">

<!-- INPUTS -->
<div class="card">
<label>Currency</label>
<select id="currency">
<option value="USD">$ USD</option>
<option value="EUR">€ EUR</option>
<option value="GBP">£ GBP</option>
<option value="INR">₹ INR</option>
</select>

<br><br>

<label>Home Price</label>
<input id="price" type="number" value="400000">

<label>Down Payment (%)</label>
<input id="down" type="number" value="20">

<label>Loan Term (years)</label>
<input id="years" type="number" value="30">

<label>Interest Rate (%)</label>
<input id="rate" type="number" value="6.228" step="0.001">

<hr>

<label>Property Tax (% / yr)</label>
<input id="tax" type="number" value="1.2">

<label>Insurance (annual)</label>
<input id="insurance" type="number" value="1500">

<label>PMI (annual)</label>
<input id="pmi" type="number" value="0">

<label>HOA (annual)</label>
<input id="hoa" type="number" value="0">

<label>Other Costs (annual)</label>
<input id="other" type="number" value="4000">

<hr>

<label>Extra Monthly Payment</label>
<input id="extraM" type="number" value="0">

<label>Extra Yearly Payment</label>
<input id="extraY" type="number" value="0">

<label>Extra One-Time Payment</label>
<input id="extraO" type="number" value="0">

<br><br>
<button class="btn" onclick="calculate()">Calculate</button>
<button class="btn alt" onclick="location.reload()">Reset</button>
</div>

<!-- RESULTS -->
<div class="card">
<div>
<b>Monthly Payment</b>
<h2 id="monthly">$0.00</h2>

<p>Total Paid: <b id="total">$0.00</b></p>
<p>Total Interest: <b id="interest">$0.00</b></p>
<p>Payoff Date: <b id="payoff">—</b></p>
</div>

<div class="chartBox">
<canvas id="chart"></canvas>
</div>

<h3>Amortization Schedule</h3>
<table>
<thead>
<tr>
<th>#</th>
<th>Date</th>
<th>Payment</th>
<th>Interest</th>
<th>Balance</th>
</tr>
</thead>
<tbody id="table"></tbody>
</table>

<br>
<button class="btn alt" onclick="window.print()">🖨 Print</button>
</div>

</div>
</div>

<script>
let chart;

function fmt(n){
  const c=document.getElementById('currency').value;
  const map={USD:'$',EUR:'€',GBP:'£',INR:'₹'};
  return map[c]+n.toFixed(2);
}

function calculate(){
  const P=document.getElementById('price').value*(1-document.getElementById('down').value/100);
  const r=document.getElementById('rate').value/100/12;
  const n=document.getElementById('years').value*12;

  const tax=P*(document.getElementById('tax').value/100)/12;
  const ins=+document.getElementById('insurance').value/12;
  const pmi=+document.getElementById('pmi').value/12;
  const hoa=+document.getElementById('hoa').value/12;
  const other=+document.getElementById('other').value/12;

  const extraM=+document.getElementById('extraM').value;
  const extraY=+document.getElementById('extraY').value;
  const extraO=+document.getElementById('extraO').value;

  const base=P*r/(1-Math.pow(1+r,-n));
  let balance=P,month=0,total=0,intTotal=0;
  let rows='',labels=[],balances=[];

  while(balance>0 && month<1000){
    month++;
    let interest=balance*r;
    let payment=base+extraM+tax+ins+pmi+hoa+other;
    if(month===1) payment+=extraO;
    if(month%12===1) payment+=extraY;

    if(payment>balance+interest) payment=balance+interest;

    balance-=payment-interest;
    total+=payment;
    intTotal+=interest;

    labels.push('M'+month);
    balances.push(balance);

    rows+=`<tr><td>${month}</td><td>M${month}</td><td>${fmt(payment)}</td><td>${fmt(interest)}</td><td>${fmt(balance)}</td></tr>`;
  }

  document.getElementById('monthly').textContent=fmt(base+tax+ins+pmi+hoa+other+extraM);
  document.getElementById('total').textContent=fmt(total);
  document.getElementById('interest').textContent=fmt(intTotal);
  document.getElementById('payoff').textContent=month+' months';
  document.getElementById('table').innerHTML=rows;

  if(chart)chart.destroy();
  chart=new Chart(document.getElementById('chart'),{
    type:'line',
    data:{labels,datasets:[{data:balances,label:'Balance',borderColor:'#1f6fb6',fill:true}]},
    options:{responsive:true,maintainAspectRatio:false}
  });
}

calculate();
</script>
</body>
</html>
